# Builds the Windows installer for a version tag, publishes it as a GitHub release and
# submits the new version to winget (microsoft/winget-pkgs).
#
# Triggered by `git push --follow-tags` after `make release`. Run it by hand
# (Actions > Release > Run workflow) to publish a tag that has no release yet.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v1.0.2
        required: true

permissions:
  contents: write # create the release and upload the installer

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # Must match the PackageIdentifier of the first manual winget submission.
  WINGET_ID: OutlawsITSoftware.MeshViewer

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The installer takes its version from gradle.properties; a tag that disagrees would
      # publish an MSI under the wrong name and break winget's version matching.
      - name: Check tag matches version
        id: version
        run: |
          $version = (Select-String -Path gradle.properties -Pattern '^version=(.+)$').Matches[0].Groups[1].Value.Trim()
          if ("v$version" -ne $env:TAG) { throw "tag $env:TAG does not match version=$version in gradle.properties" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build MSI
        run: .\gradlew.bat packageMsi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi = "build/compose/binaries/main/msi/MeshViewer-${{ steps.version.outputs.version }}.msi"
          if (-not (Test-Path $msi)) { throw "installer not found: $msi" }
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $msi --clobber
          } else {
            gh release create $env:TAG $msi --verify-tag --title "Mesh Viewer ${{ steps.version.outputs.version }}" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'gh release failed' }

      # wingetcreate copies all metadata from the previous winget version and only swaps in
      # the new URL, hash and ProductCode, so the very first version must be submitted by
      # hand (see README). WINGET_TOKEN: classic PAT with the public_repo scope; it forks
      # winget-pkgs into that account and opens the PR from there.
      - name: Submit to winget
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Host '::warning::WINGET_TOKEN secret not set; skipping the winget submission'
            exit 0
          }
          $version = '${{ steps.version.outputs.version }}'
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/MeshViewer-$version.msi"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          # '|x64': MSI files do not reliably reveal their architecture to wingetcreate.
          .\wingetcreate.exe update $env:WINGET_ID --version $version --urls "$url|x64" --submit --token $env:WINGET_TOKEN
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate failed ($LASTEXITCODE)" }
